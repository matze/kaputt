# kaputt.matze.lol production configuration.
#
# Targets are upserted into the database at startup, so edit this file and rerun
# the server for any new target. management. Removing a target disables it but
# keeps its history.

listen = "127.0.0.1:8080"
database = "kaputt.db"

[[targets]]
id = "karlsruhe"
name = "Stadt Karlsruhe"
url = "https://www.karlsruhe.de/"
expect_status = 200
interval_s = 300
timeout_s = 10
fail_threshold = 2
ok_threshold = 2
enabled = true
sort = 10

