[package]
name = "kaputt"
version = "0.6.0"
edition = "2024"

[dependencies]
anyhow = "1"
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8"] }
axum = "0.8"
jiff = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "http2"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54", features = ["full"] }
tokio-rusqlite = "0.8"
toml = "1.1"
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"
